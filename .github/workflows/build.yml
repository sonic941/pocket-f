name: Build PocketFC19 JAR
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Fetch J2ME Stubs & ProGuard
        run: |
          mkdir -p libs build classes
          cat << 'EOF' > pom.xml
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>tmp</groupId>
            <artifactId>tmp</artifactId>
            <version>1.0</version>
            <dependencies>
              <dependency><groupId>org.microemu</groupId><artifactId>midp20</artifactId><version>2.0.4</version></dependency>
              <dependency><groupId>org.microemu</groupId><artifactId>cldcapi11</artifactId><version>2.0.4</version></dependency>
              <dependency><groupId>net.sf.proguard</groupId><artifactId>proguard-base</artifactId><version>6.2.2</version></dependency>
            </dependencies>
          </project>
          EOF
          mvn dependency:copy-dependencies -DoutputDirectory=libs

      - name: Compile and Preverify
        run: |
          javac -source 1.3 -target 1.3 -bootclasspath libs/cldcapi11-2.0.4.jar:libs/midp20-2.0.4.jar -d classes PocketFC19.java
          jar cfm build/raw.jar MANIFEST.MF -C classes .
          java -jar libs/proguard-base-6.2.2.jar -injars build/raw.jar -outjars build/PocketFC19.jar -libraryjars libs/cldcapi11-2.0.4.jar -libraryjars libs/midp20-2.0.4.jar -microedition -dontobfuscate -keep "public class PocketFC19"

      - name: Upload PocketFC19.jar
        uses: actions/upload-artifact@v4
        with:
          name: PocketFC19-Q55
          path: build/PocketFC19.jar
